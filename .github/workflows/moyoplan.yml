name: Moyoplan Daily Crawler

on:
  # 매일 한국시간 오전 7시 자동 실행
  # KST 07:00 = UTC 전날 22:00
  schedule:
    - cron: "0 22 * * *"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

concurrency:
  group: moyoplan-daily-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          echo "===== Package check ====="
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import bs4; print('beautifulsoup4: OK')"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import openpyxl; print('openpyxl:', openpyxl.__version__)"
          python -c "import truststore; print('truststore: OK')"

      - name: Check Chrome
        run: |
          google-chrome --version || true

      - name: Run Moyoplan crawler
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u moyoplan_crawler.py

      - name: Check generated files
        run: |
          echo "===== Excel ====="
          test -s moyoplan_parsed_plans.xlsx
          ls -lh moyoplan_parsed_plans.xlsx

          echo "===== Mail HTML ====="
          test -s mail_body.html
          ls -lh mail_body.html
          wc -c mail_body.html

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: moyoplan-parsed-plans
          path: moyoplan_parsed_plans.xlsx
          retention-days: 30
          if-no-files-found: error

      - name: Commit Excel result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add moyoplan_parsed_plans.xlsx

          if git diff --cached --quiet; then
            echo "변경된 Excel 파일이 없습니다."
          else
            git commit -m "Update Moyoplan crawling result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare HTML mail body
        run: |
          {
            echo 'MAIL_BODY<<EOF'
            cat mail_body.html
            echo
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Set KST report date
        run: |
          echo "REPORT_DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Send Excel by Gmail
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "모요 요금제 Daily Report (${{ env.REPORT_DATE }})"

          from: ${{ secrets.MAIL_USERNAME }}

          to: "kjch444@lguplus.co.kr, junghoonchoi@lguplus.co.kr, ydythetop@lguplus.co.kr, jjang@lguplus.co.kr, 33soso@lguplus.co.kr"

          html_body: ${{ env.MAIL_BODY }}

          attachments: moyoplan_parsed_plans.xlsx

          priority: normal
