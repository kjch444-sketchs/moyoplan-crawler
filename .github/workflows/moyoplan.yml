name: Moyoplan Daily Crawler

on:
  # ============================================================
  # 매일 한국시간 오전 7시 자동 실행
  # GitHub Actions cron은 UTC 기준
  # KST 07:00 = UTC 전날 22:00
  # ============================================================
  schedule:
    - cron: "30 21 * * *"

  # ============================================================
  # GitHub Actions 화면에서 수동 실행 가능
  # ============================================================
  workflow_dispatch:


# ============================================================
# 예약 실행과 수동 실행이 겹치는 경우 동시 실행 방지
# 먼저 실행된 작업이 끝난 후 다음 작업 실행
# ============================================================

concurrency:
  group: moyoplan-daily-crawler
  cancel-in-progress: false


jobs:

  crawl:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ========================================================
      # 1. GitHub 저장소 가져오기
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ========================================================
      # 2. Python 설치
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ========================================================
      # 3. Python 패키지 설치
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ========================================================
      # 4. Chrome 확인
      # ========================================================

      - name: Check Chrome
        run: |
          google-chrome --version || true


      # ========================================================
      # 5. 모요 크롤링 실행
      # ========================================================

      - name: Run Moyoplan crawler
        run: |
          python moyoplan_crawler.py


      # ========================================================
      # 6. 생성된 Excel 파일 확인
      # ========================================================

      - name: Check Excel file
        run: |
          ls -lh moyoplan_parsed_plans.xlsx


      # ========================================================
      # 7. GitHub Actions Artifact 저장
      #
      # 실행 결과 페이지에서 Excel 다운로드 가능
      # ========================================================

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v6
        with:
          name: moyoplan-parsed-plans
          path: moyoplan_parsed_plans.xlsx
          retention-days: 30


      # ========================================================
      # 8. 최신 Excel 파일을 GitHub 저장소에 반영
      #
      # 크롤링 도중 main 브랜치가 변경되더라도
      # 최신 원격 변경사항을 rebase한 뒤 push
      # ========================================================

      - name: Commit Excel result
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add moyoplan_parsed_plans.xlsx

          if git diff --cached --quiet; then

            echo "변경된 Excel 파일이 없습니다."

          else

            git commit -m "Update Moyoplan crawling result"

            echo "원격 main 브랜치의 최신 변경사항을 확인합니다."

            git pull --rebase origin main

            echo "크롤링 결과를 main 브랜치에 반영합니다."

            git push origin HEAD:main

          fi


      # ========================================================
      # 9. Gmail로 Excel 발송
      # ========================================================

      - name: Send Excel by Gmail
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "모요 요금제 크롤링 결과"

          from: ${{ secrets.MAIL_USERNAME }}

          to: "kjch444@lguplus.co.kr"

          body: |
            안녕하세요.

            오늘의 모요 요금제 크롤링이 완료되었습니다.

            실행 시간:
            ${{ github.run_started_at }}

            크롤링 결과 Excel 파일을 첨부합니다.

            파일명:
            moyoplan_parsed_plans.xlsx

            이 메일은 자동으로 발송되었습니다.

          attachments: moyoplan_parsed_plans.xlsx

          priority: normal
